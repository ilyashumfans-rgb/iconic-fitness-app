  /tracking/progress:
    get:
      operationId: getProgress
      tags: [tracking]
      summary: Multi-day progress series for charts
      parameters:
        - in: query
          name: days
          schema: { type: integer, default: 7, description: "Number of trailing days (1-31)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressReport" }

  /tracking/goals:
    get:
      operationId: getGoals
      tags: [tracking]
      summary: Get the user's daily goals
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goals" }
    patch:
      operationId: updateGoals
      tags: [tracking]
      summary: Update daily goals
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalsUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goals" }

  /checkins:
    get:
      operationId: listMyCheckins
      tags: [checkins]
      summary: The user's recent gym check-ins
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Checkin" }
    post:
      operationId: createCheckin
      tags: [checkins]
      summary: Check in to a gym (once per gym per day)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckinInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checkin" }

  /community:
    get:
      operationId: listCommunityPosts
      tags: [community]
      summary: Approved public community transformation feed
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50 } }
        - { in: query, name: beforeId, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Approved submissions only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityPostPage" }
    post:
      operationId: createCommunityPost
      tags: [community]
      summary: Submit a before and after transformation for moderation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCommunityPostRequest" }
      responses:
        "201":
          description: Pending submission created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityPostCreated" }
  /community/mine:
    get:
      operationId: listMyCommunityPosts
      tags: [community]
      summary: The signed-in member's submissions and moderation statuses
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50 } }
        - { in: query, name: beforeId, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Member submissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityPostPage" }
  /community/{id}/coach:
    get:
      operationId: getCommunityCoach
      tags: [community]
      summary: The currently available coach attached to a community submission
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Available coach visible to the caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityCoach" }
  /community/{id}:
    get:
      operationId: getCommunityPost
      tags: [community]
      summary: A community submission when approved, owned by the member, or viewed by an admin
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Submission visible to the caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityPost" }
  /community/trainers:
    get:
      operationId: listCommunityTrainers
      tags: [community]
      summary: Active linked PT trainers for a selected branch
      parameters:
        - in: query
          name: gymId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Available trainers, or an empty list for an unmapped branch
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CommunityTrainer" }
  /community/{id}/withdraw:
    post:
      operationId: withdrawCommunityPost
      tags: [community]
      summary: Withdraw the signed-in member's community submission
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Withdrawn
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityPostCreated" }

components:
  securitySchemes:
    memberBearer:
      type: http
      scheme: bearer
    adminSession:
      type: apiKey
      in: cookie
      name: connect.sid
  responses:
    ReviewBadRequest:
      description: Invalid input, attempted seed relabelling or 500-review limit reached
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ReviewError"}
    ReviewUnauthorized:
      description: Admin authentication required
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ReviewError"}
    ReviewNotFound:
      description: Review not found
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ReviewError"}
  parameters:
    JourneyPortal:
      in: path
      name: portal
      required: true
      schema: {type: string, enum: [admin, staff, partner, agency]}
    JourneyUserId:
      in: path
      name: userId
      required: true
      schema: {type: integer, minimum: 1}
  schemas:
    WhatsappOtpRequest:
      type: object
      required: [mobile]
      properties:
        mobile: { type: string, minLength: 10, maxLength: 20 }
    WhatsappOtpChallenge:
      type: object
      required: [challengeId, expiresInSeconds, resendAfterSeconds]
      properties:
        challengeId: { type: string, format: uuid }
        expiresInSeconds: { type: integer, enum: [600] }
        resendAfterSeconds: { type: integer, enum: [60] }
    WhatsappOtpVerification:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string, format: uuid }
        code: { type: string, pattern: '^[0-9]{6}$' }
    WhatsappOtpResult:
      oneOf:
        - type: object
          required: [ticket, isNewUser]
          properties:
            ticket: { type: string }
            isNewUser: { type: boolean, enum: [false] }
        - type: object
          required: [continuationToken, isNewUser, requiresEmailVerification]
          properties:
            continuationToken: { type: string }
            isNewUser: { type: boolean, enum: [true] }
            requiresEmailVerification: { type: boolean, enum: [true] }
            requiresAccountSignIn:
              type: boolean
              enum: [true]
              description: Present when matching legacy profile candidates exist and the caller must authenticate the intended account before completion.
    WhatsappOtpCompletion:
      type: object
      required: [continuationToken]
      properties:
        continuationToken: { type: string, pattern: '^[a-f0-9]{64}$' }
    WhatsappOtpCompleted:
      type: object
      required: [isNewUser]
      properties:
        isNewUser: { type: boolean }
    AdminReviewUpdateInput:
      anyOf:
        - {$ref: "#/components/schemas/ReviewInput"}
        - type: object
          additionalProperties: false
          required: [reviewText, rating, sortOrder, isPublished]
          properties:
            reviewText: {type: string, minLength: 1, maxLength: 2000}
            rating: {type: integer, minimum: 1, maximum: 5}
            sortOrder: {type: integer}
            isPublished: {type: boolean}
    MemberTrainerReviewInput:
      type: object
      additionalProperties: false
      required: [rating, reviewText]
      properties:
        rating: {type: integer, minimum: 1, maximum: 5}
        reviewText: {type: string, minLength: 1, maxLength: 2000}
    TrainerReviewModerationInput:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [approved, rejected]}
    TrainerProfileContent:
      type: object
      additionalProperties: false
      required: [coverPhotoUrl, photoUrl, bio, qualifications, specialties, interests, certificates]
      properties:
        coverPhotoUrl: {type: string, maxLength: 2000}
        photoUrl: {type: string, maxLength: 2000}
        bio: {type: string, maxLength: 5000}
        qualifications: {type: array, maxItems: 30, items: {type: string, maxLength: 200}}
        specialties: {type: array, maxItems: 20, items: {type: string, maxLength: 100}}
        interests: {type: array, maxItems: 20, items: {type: string, maxLength: 100}}
        certificates:
          type: array
          maxItems: 20
          items:
            type: object
            required: [title, url]
            properties:
              title: {type: string, minLength: 1, maxLength: 200}
              url: {type: string, minLength: 1, maxLength: 2000}
    OwnTrainerReviewResponse:
      type: object
      required: [review]
      properties:
        review:
          type: [object, "null"]
          required: [id, rating, reviewText, status, isPublished]
          properties:
            id: {type: integer}
            rating: {type: integer}
            reviewText: {type: string}
            status: {type: string, enum: [pending, approved, rejected]}
            isPublished: {type: boolean}
    ReviewTrainerOption:
      type: object
      required: [id, name, gymId, branchName]
      properties:
        id: {type: string}
        name: {type: string}
        gymId: {type: integer}
        branchName: {type: string}
    LiveTrainerProfile:
      allOf:
        - {$ref: "#/components/schemas/ReviewTrainerOption"}
        - type: object
          required: [photoUrl, reviews, rating, reviewCount]
          properties:
            profile: {$ref: "#/components/schemas/TrainerProfileContent"}
            photoUrl: {type: [string, "null"]}
            reviews:
              type: array
              items: {$ref: "#/components/schemas/Review"}
            rating: {type: [number, "null"]}
            reviewCount: {type: integer}
    ReviewInput:
      type: object
      additionalProperties: false
      required: [reviewerName, branchName, reviewText, rating, isSample, isPublished, sortOrder]
      properties:
        reviewerName: {type: string, minLength: 1, maxLength: 100}
        branchName: {type: string, minLength: 1, maxLength: 150}
        trainerId: {type: [string, "null"], minLength: 1, maxLength: 100}
        gymId: {type: [integer, "null"], minimum: 1, maximum: 2147483647}
        reviewText: {type: string, minLength: 1, maxLength: 2000}
        rating: {type: integer, minimum: 1, maximum: 5}
        isSample:
          type: boolean
          description: Fictional sample, not a verified endorsement. Seeded samples must remain true.
        isPublished: {type: boolean}
        sortOrder: {type: integer, minimum: -2147483648, maximum: 2147483647}
    Review:
      type: object
      required: [id, reviewerName, branchName, reviewText, rating, isSample, isPublished, sortOrder, createdAt, updatedAt]
      properties:
        isMemberReview: {type: boolean}
        moderationStatus: {type: [string, "null"], enum: [pending, approved, rejected, null]}
        id: {type: integer}
        reviewerName: {type: string}
        branchName: {type: string}
        trainerId: {type: [string, "null"]}
        gymId: {type: [integer, "null"]}
        reviewText: {type: string}
        rating: {type: integer, minimum: 1, maximum: 5}
        isSample: {type: boolean}
        isPublished: {type: boolean}
        sortOrder: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ReviewList:
      type: object
      required: [reviews]
      properties:
        reviews:
          type: array
          maxItems: 500
          items: {$ref: "#/components/schemas/Review"}
    ReviewError:
      type: object
      required: [error]
      properties:
        error: {type: string}
    MemberJourneyHealthHistoryInput:
      type: object
      required: [version, injuries, conditions, medications, allergies, exerciseRestrictions, consent]
      additionalProperties: false
      properties:
        version: {type: integer, minimum: 0}
        injuries: {type: string, minLength: 1, maxLength: 10000}
        conditions: {type: string, minLength: 1, maxLength: 10000}
        medications: {type: string, minLength: 1, maxLength: 10000}
        allergies: {type: string, minLength: 1, maxLength: 10000}
        exerciseRestrictions: {type: string, minLength: 1, maxLength: 10000}
        notes: {type: string, maxLength: 10000}
        consent: {type: boolean, enum: [true]}
    MemberJourneyAction:
      type: object
      description: Server validates required fields for each action and stage; irregular attendance requires response and future nextDate. record_trial writes the actual assigned PT program, not a journey-only completion flag.
      required: [version, action]
      properties:
        version: {type: integer, minimum: 0}
        action:
          type: string
          enum: [review_health, assign_trainer, record_trial, pt_decision, pt_followup, assign_general_trainer, dietician_review, issue_chart, attendance_review, attendance_followup]
        staffId: {type: integer, minimum: 1}
        sessionNo: {type: integer, enum: [1, 2]}
        note: {type: string, minLength: 1, maxLength: 10000}
        response: {type: string, minLength: 1, maxLength: 10000}
        content: {type: string, minLength: 1, maxLength: 10000}
        decision: {type: string, enum: [yes, no, regular, irregular]}
        nextDate: {type: string, format: date-time}
    MemberJourney:
      type: object
      required: [userId, gymId, memberName, version, currentStage, nextAction, assigneeId, overdue, dueAt, canManage, trainerId, generalTrainerId, dieticianId, ptDecision, charts, events, followups, attendance, facts]
      properties:
        userId: {type: integer}
        gymId: {type: integer}
        memberName: {type: string}
        version: {type: integer}
        currentStage:
          type: string
          enum: [health_history, bca_bmi_report, health_history_review, assign_trainer, trial1, rating_feedback1, trial2, rating_written_feedback2, pt_decision, pt_followup, general_trainer, dietician, workout_chart1, workout_chart2, workout_chart3, attendance_review, attendance_followup, regular_continue]
        nextAction: {type: string}
        assigneeId: {type: [integer, "null"]}
        assigneeName: {type: [string, "null"]}
        trialProgramId: {type: [integer, "null"]}
        overdue: {type: boolean}
        dueAt: {type: [string, "null"]}
        canManage: {type: boolean}
        canReviewHealth: {type: boolean}
        completedStages:
          type: array
          items: {type: string}
        planDay: {type: [integer, "null"]}
        cycleComplete: {type: boolean}
        healthHistory:
          type: [object, "null"]
          properties:
            injuries: {type: string}
            conditions: {type: string}
            medications: {type: string}
            allergies: {type: string}
            exerciseRestrictions: {type: string}
            notes: {type: string}
            consent: {type: boolean}
            submittedAt: {type: string}
        reviewedAt: {type: [string, "null"]}
        reviewNote: {type: [string, "null"]}
        trainerId: {type: [integer, "null"]}
        generalTrainerId: {type: [integer, "null"]}
        dieticianId: {type: [integer, "null"]}
        ptDecision: {type: [string, "null"], enum: ["yes", "no", null]}
        charts:
          type: array
          items:
            type: object
            required: [id, label, issuedAt]
            properties:
              id: {type: integer}
              chartNo: {type: integer}
              label: {type: string}
              content: {type: string}
              issuedAt: {type: string}
        events:
          type: array
          items:
            type: object
            required: [id, action, actor, createdAt]
            properties:
              id: {type: integer}
              action: {type: string}
              actor: {type: string}
              createdAt: {type: string}
        followups:
          type: array
          items:
            type: object
            required: [id, kind, nextDate, createdAt]
            properties:
              id: {type: integer}
              kind: {type: string}
              response: {type: string}
              nextDate: {type: string}
              createdAt: {type: string}
        attendance:
          type: object
          required: [checkinsLast30Days]
          properties:
            checkinsLast30Days: {type: integer}
        facts:
          type: object
          required: [bmi, trial1, feedback1, trial2, feedback2, paidPt]
          properties:
            bmi: {type: boolean}
            trial1: {type: boolean}
            feedback1: {type: boolean}
            trial2: {type: boolean}
            feedback2: {type: boolean}
            paidPt: {type: boolean}
    AttendanceVisit:
      type: object
      required: [id, gymId, gymName, checkedInAt, checkedOutAt, durationMinutes, method]
      properties:
        id: { type: integer }
        gymId: { type: integer }
        gymName: { type: string }
        checkedInAt: { type: string }
        checkedOutAt: { type: [string, "null"] }
        durationMinutes: { type: [integer, "null"] }
        method: { type: string }
    AttendanceHistory:
      type: object
      required: [month, visits, activeVisit, summary]
      properties:
        month: { type: string }
        visits:
          type: array
          items: { $ref: "#/components/schemas/AttendanceVisit" }
        activeVisit:
          anyOf:
            - { $ref: "#/components/schemas/AttendanceVisit" }
            - { type: "null" }
        summary:
          type: object
          required: [visits, completedVisits, totalMinutes]
          properties:
            visits: { type: integer }
            completedVisits: { type: integer }
            totalMinutes: { type: integer }
    AttendanceScanInput:
      type: object
      required: [code, action]
      properties:
        code: { type: string, minLength: 1, maxLength: 512 }
        action: { type: string, enum: [checkin, checkout] }
    AttendanceScanResult:
      type: object
      required: [visit, outcome]
      properties:
        visit: { $ref: "#/components/schemas/AttendanceVisit" }
        outcome: { type: string, enum: [checked_in, already_checked_in, checked_out, already_checked_out] }
    PartnerAttendanceQr:
      type: object
      required: [gymId, gymName, address, code]
      properties:
        gymId: { type: integer }
        gymName: { type: string }
        address: { type: string }
        code: { type: string, description: "Raw signed token. Encode in iconic-app://check-in?code=<URLencoded token> for printing. POST only the raw token to attendance/scan." }
    NotificationSounds:
      type: object
      required: [members, trainers]
      properties:
        members: { type: string, nullable: true }
        trainers: { type: string, nullable: true }
    AiChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: ["user", "assistant"] }
        content: { type: string }
    AiChatInput:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/AiChatMessage" }
    AiChatOutput:
      type: object
      required: [reply]
      properties:
        reply: { type: string }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    CommunityTrainer:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    CommunityCoach:
      type: object
      required: [name, photoUrl, gymId, gymName, trainerId]
      properties:
        name: { type: string }
        photoUrl: { type: ["string", "null"] }
        gymId: { type: integer }
        gymName: { type: string }
        trainerId: { type: string }
    CreateCommunityPostRequest:
      type: object
      required: [caption, beforeImage, afterImage, publicSharingConsent]
      properties:
        caption: { type: string, maxLength: 1200 }
        beforeImage: { type: string, description: "Base64 or data URL encoded JPEG, PNG, or WebP still photo" }
        afterImage: { type: string, description: "Base64 or data URL encoded JPEG, PNG, or WebP still photo" }
        publicSharingConsent: { type: boolean, const: true }
        trainerStaffId: { type: integer, nullable: true }
        gymId: { type: integer, nullable: true }
    CommunityPostCreated:
      type: object
      required: [id, status, submittedAt]
      properties:
        id: { type: integer }
        status: { type: string, enum: [pending, withdrawn] }
        submittedAt: { type: string, format: date-time }
    CommunityPost:
      type: object
      required: [id, caption, authorName, submittedAt]
      properties:
        id: { type: integer }
        caption: { type: string }
        trainerName: { type: string, nullable: true }
        authorName: { type: string }
        authorAvatarUrl: { type: string, nullable: true }
        beforeImageUrl: { type: string, nullable: true }
        afterImageUrl: { type: string, nullable: true }
        submittedAt: { type: string, format: date-time }
        status: { type: string, enum: [pending, approved, rejected, unpublished, withdrawn] }
        rejectionReason: { type: string, nullable: true }
        publicSharingConsent: { type: boolean }
        reviewedAt: { type: string, format: date-time, nullable: true }
    CommunityPostPage:
      type: object
      required: [items, nextBeforeId]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CommunityPost" }
        nextBeforeId: { type: integer, nullable: true }

    UserProfile:
      type: object
      required:
        [
          id, username, name, email, mobile, gender, age, heightCm, weightKg,
          fitnessGoal, avatarUrl, city, bmi, fitnessScore,
          dailyCalories, dailyWaterMl, dailySleepHours, restingHr,
          streakDays, weeklyWorkouts, weeklyGoal, joinedAt,
          assessmentComplete, bmr, tdee, bodyFatPct
        ]
      properties:
        id: { type: integer }
        username: { type: string, nullable: true }
        name: { type: string }
        email: { type: string }
        mobile: { type: string }
        gender: { type: string }
        age: { type: integer, nullable: true, description: "Null until a member supplies a real age" }
        heightCm: { type: number, nullable: true, description: "Null until a member supplies a real height" }
        weightKg: { type: number, nullable: true, description: "Null until a member supplies a real weight" }
        fitnessGoal: { type: string, nullable: true, description: "Null until a member supplies a real goal" }
        avatarUrl: { type: string }
        city: { type: string }
        bmi: { type: number }
        fitnessScore: { type: integer, description: "0-100 composite AI score" }
        dailyCalories: { type: integer }
        dailyWaterMl: { type: integer }
        dailySleepHours: { type: number }
        restingHr: { type: integer }
        streakDays: { type: integer }
        weeklyWorkouts: { type: integer }
        weeklyGoal: { type: integer }
        joinedAt: { type: string, format: date-time }
        assessmentComplete:
          { type: boolean, description: "True once the AI fitness assessment is done" }
        experienceLevel:
          { type: string, nullable: true, description: "new | experienced" }
        targetWeightKg: { type: number, nullable: true }
        bmr: { type: number, description: "Basal metabolic rate (kcal); 0 if unknown" }
        tdee: { type: number, description: "Maintenance calories (kcal); 0 if unknown" }
        bodyFatPct: { type: number, description: "Estimated body fat %; 0 if unknown" }
    MembershipLookupBody:
      type: object
      required: [mobile]
      properties:
        mobile: { type: string, minLength: 10 }
    MembershipLookupResult:
      type: object
      required: [found, memberName, branchName]
      properties:
        found: { type: boolean }
        memberName:
          { type: string, description: "Masked member name (e.g. \"Rah••• K.\"); empty when not found" }
        branchName:
          { type: string, description: "Branch of the member's primary plan; empty when not found" }

    UserProfileUpdate:
      type: object
      properties:
        username: { type: string, nullable: true }
        name: { type: string }
        mobile: { type: string }
        gender: { type: string }
        age: { type: integer }
        heightCm: { type: number }
        weightKg: { type: number }
        fitnessGoal: { type: string }
        avatarUrl: { type: string }
        city: { type: string }
        weeklyGoal: { type: integer }

    FitnessSetup:
      type: object
      required: [requiredForOnboarding, currentStep, completed, exists]
      properties:
        exists: { type: boolean, description: "Whether this member has saved an optional setup profile" }
        requiredForOnboarding: { type: boolean, description: "Only true for a newly provisioned member until completed" }
        currentStep: { type: integer, minimum: 1, maximum: 4 }
        completed: { type: boolean }
        completedAt: { type: string, format: date-time, nullable: true }
        unitSystem: { type: string, nullable: true, enum: [metric, imperial] }
        heightCm: { type: number, nullable: true, description: "Canonical centimetres" }
        weightKg: { type: number, nullable: true, description: "Canonical kilograms" }
        age: { type: integer, nullable: true }
        goals: { type: array, items: { type: string } }
