openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: GYMCO customer API — multi-gym memberships, classes, bookings, check-ins, and fitness tracking.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: profile
  - name: fitness-setup
  - name: gyms
  - name: classes
  - name: bookings
  - name: memberships
  - name: trainers
  - name: wallet
  - name: referrals
    description: Refer & Earn — referral codes and wallet points
  - name: dashboard
  - name: tracking
    description: Daily wellness tracking — water, meals/calories, workouts, steps, goals, progress
  - name: checkins
    description: Member gym check-ins
  - name: ai
    description: Iconic Fitness AI assistant
  - name: community
    description: Member transformation stories. Photos remain private until an admin approves a consented submission.
paths:
  /auth/whatsapp/request:
    post:
      operationId: requestWhatsappOtp
      tags: [memberships]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsappOtpRequest'
      responses:
        '200':
          description: WhatsApp delivery accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappOtpChallenge'
        '400':
          description: Invalid mobile
        '429':
          description: Send limit reached
        '409':
          description: A newer code superseded this delivery
        '502':
          description: WhatsApp provider could not accept delivery
        '503':
          description: Authentication unavailable
  /auth/whatsapp/verify:
    post:
      operationId: verifyWhatsappOtp
      tags: [memberships]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsappOtpVerification'
      responses:
        '200':
          description: Existing-member ticket or verified-phone continuation. Legacy duplicate profiles require authenticated account proof.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappOtpResult'
        '400':
          description: Invalid request
        '401':
          description: Invalid, expired, exhausted or previously used code
        '409':
          description: Privileged identities must use email/password, or the member cannot be safely resolved
        '503':
          description: Authentication unavailable
  /auth/whatsapp/complete:
    post:
      operationId: completeWhatsappOtp
      tags: [memberships]
      description: Requires an authenticated Clerk session with verified email. For legacy duplicates, the email must prove the selected candidate account. Complete before fetching member profile. Continuation is single-use and expires after ten minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsappOtpCompletion'
      responses:
        '200':
          description: Verified phone securely linked and member onboarding ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappOtpCompleted'
        '400':
          description: Invalid request
        '401':
          description: Verified email session or valid continuation required
        '409':
          description: Account or phone conflict
        '503':
          description: Authentication unavailable
  /admin/trainers/live/{trainerId}/profile:
    parameters:
      - {in: path, name: trainerId, required: true, schema: {type: string}}
      - {in: query, name: gymId, required: true, schema: {type: integer, minimum: 1}}
    get:
      operationId: getAdminLiveTrainerProfile
      tags: [trainers]
      security: [{adminSession: []}]
      responses:
        "200":
          description: Branch-specific live trainer profile
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LiveTrainerProfile"}
    put:
      operationId: updateAdminLiveTrainerProfile
      tags: [trainers]
      security: [{adminSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TrainerProfileContent"}
      responses:
        "200":
          description: Saved trainer profile
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LiveTrainerProfile"}
  /trainers/live/{trainerId}/review:
    parameters:
      - {in: path, name: trainerId, required: true, schema: {type: string}}
      - {in: query, name: gymId, required: true, schema: {type: integer, minimum: 1}}
    get:
      operationId: getOwnTrainerReview
      tags: [reviews]
      security: [{memberBearer: []}]
      responses:
        "200":
          description: Only the signed-in member's own review
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OwnTrainerReviewResponse"}
    put:
      operationId: saveOwnTrainerReview
      tags: [reviews]
      security: [{memberBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MemberTrainerReviewInput"}
      responses:
        "200":
          description: Submitted for approval; editing withdraws the previous published version
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OwnTrainerReviewResponse"}
        "403": {description: Active membership at the trainer's branch required}
  /admin/reviews/{id}/moderation:
    post:
      operationId: moderateTrainerReview
      tags: [reviews]
      security: [{adminSession: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TrainerReviewModerationInput"}
      responses:
        "200":
          description: Moderated member review
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Review"}
  /admin/reviews/trainers:
    get:
      operationId: listReviewTrainerOptions
      tags: [reviews]
      security: [{adminSession: []}]
      responses:
        "200":
          description: Eligible branch-linked live PT trainers
          content:
            application/json:
              schema:
                type: object
                required: [trainers]
                properties:
                  trainers:
                    type: array
                    items: {$ref: "#/components/schemas/ReviewTrainerOption"}
        "401": {$ref: "#/components/responses/ReviewUnauthorized"}
        "502":
          description: Trainer provider unavailable
  /trainers/live/{trainerId}:
    get:
      operationId: getLiveTrainerProfile
      tags: [trainers]
      parameters:
        - name: trainerId
          in: path
          required: true
          schema: {type: string}
        - name: gymId
          in: query
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: Branch-verified trainer profile; rating excludes sample reviews
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LiveTrainerProfile"}
        "400": {$ref: "#/components/responses/ReviewBadRequest"}
        "404": {$ref: "#/components/responses/ReviewNotFound"}
        "502":
          description: Trainer provider unavailable
  /reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: Published reviews ordered by sortOrder then id, with samples labelled and no aggregate rating
      responses:
        "200":
          description: Published reviews
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReviewList"}
  /admin/reviews:
    get:
      operationId: listAdminReviews
      tags: [reviews]
      security: [{adminSession: []}]
      responses:
        "200":
          description: All reviews including unpublished samples
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReviewList"}
        "401": {$ref: "#/components/responses/ReviewUnauthorized"}
    post:
      operationId: createAdminReview
      tags: [reviews]
      security: [{adminSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReviewInput"}
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Review"}
        "400": {$ref: "#/components/responses/ReviewBadRequest"}
        "401": {$ref: "#/components/responses/ReviewUnauthorized"}
  /admin/reviews/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, minimum: 1, maximum: 2147483647}
    put:
      operationId: updateAdminReview
      tags: [reviews]
      security: [{adminSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminReviewUpdateInput"}
      responses:
        "200":
          description: Updated review; seeded samples must remain labelled samples
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Review"}
        "400": {$ref: "#/components/responses/ReviewBadRequest"}
        "401": {$ref: "#/components/responses/ReviewUnauthorized"}
        "404": {$ref: "#/components/responses/ReviewNotFound"}
    delete:
      operationId: deleteAdminReview
      tags: [reviews]
      security: [{adminSession: []}]
      responses:
        "200":
          description: Deleted review
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: {type: boolean}
        "400": {$ref: "#/components/responses/ReviewBadRequest"}
        "401": {$ref: "#/components/responses/ReviewUnauthorized"}
        "404": {$ref: "#/components/responses/ReviewNotFound"}
  /member-journey/mine:
    get:
      operationId: getMyMemberJourney
      tags: [member-journey]
      responses:
        "200":
          description: Current optional journey; existing members are not forced to onboard.
          content:
            application/json:
              schema:
                type: object
                required: [journey, branchRequired]
                properties:
                  journey:
                    anyOf:
                      - $ref: "#/components/schemas/MemberJourney"
                      - type: "null"
                  branchRequired: {type: boolean}
  /member-journey/mine/health-history:
    put:
      operationId: saveMyMemberJourneyHealthHistory
      tags: [member-journey]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MemberJourneyHealthHistoryInput"}
      responses:
        "200":
          description: Updated journey
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemberJourney"}
  /member-journey/mine/feedback:
    post:
      operationId: submitMyMemberJourneyFeedback
      tags: [member-journey]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, kind, response]
              properties:
                version: {type: integer, minimum: 0}
                kind: {type: string, enum: [pt, attendance]}
                rating: {type: integer, minimum: 1, maximum: 5}
                response: {type: string, minLength: 1, maxLength: 10000}
      responses:
        "200":
          description: Feedback saved; attendance response never changes classification.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemberJourney"}
  /{portal}/member-journey:
    parameters:
      - {$ref: "#/components/parameters/JourneyPortal"}
    get:
      operationId: listMemberJourneys
      tags: [member-journey]
      responses:
        "200":
          description: Scope-filtered journey overview.
          content:
            application/json:
              schema:
                type: object
                required: [journeys, canManage]
                properties:
                  journeys:
                    type: array
                    items: {$ref: "#/components/schemas/MemberJourney"}
                  canManage: {type: boolean}
  /{portal}/member-journey/options:
    parameters:
      - {$ref: "#/components/parameters/JourneyPortal"}
    get:
      operationId: getMemberJourneyOptions
      tags: [member-journey]
      responses:
        "200":
          description: Trusted branch membership candidates and active authorized staff.
          content:
            application/json:
              schema:
                type: object
                required: [members, assignees, gyms, canManage]
                properties:
                  canManage: {type: boolean}
                  members:
                    type: array
                    items:
                      type: object
                      required: [id, name, gymId]
                      properties:
                        id: {type: integer}
                        name: {type: string}
                        gymId: {type: integer}
                  assignees:
                    type: array
                    items:
                      type: object
                      required: [id, name, gymId]
                      properties:
                        id: {type: integer}
                        name: {type: string}
                        gymId: {type: integer}
                        journeyRole: {type: [string, "null"]}
                  gyms:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: {type: integer}
                        name: {type: string}
  /{portal}/member-journey/enroll:
    parameters:
      - {$ref: "#/components/parameters/JourneyPortal"}
    post:
      operationId: enrollMemberJourney
      tags: [member-journey]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, gymId]
              properties:
                userId: {type: integer}
                gymId: {type: integer}
      responses:
        "200":
          description: Enrolled journey; trusted branch association is mandatory.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemberJourney"}
  /{portal}/member-journey/{userId}:
    parameters:
      - {$ref: "#/components/parameters/JourneyPortal"}
      - {$ref: "#/components/parameters/JourneyUserId"}
    get:
      operationId: getMemberJourney
      tags: [member-journey]
      responses:
        "200":
          description: Scoped detail; sensitive content omitted for read-only roles.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemberJourney"}
  /{portal}/member-journey/{userId}/actions:
    parameters:
      - {$ref: "#/components/parameters/JourneyPortal"}
      - {$ref: "#/components/parameters/JourneyUserId"}
    post:
      operationId: actOnMemberJourney
      tags: [member-journey]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MemberJourneyAction"}
      responses:
        "200":
          description: Versioned, audited action applied.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemberJourney"}
  /attendance/mine:
    get:
      operationId: getMyAttendance
      tags: [attendance]
      parameters:
        - in: query
          name: month
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
      responses:
        "200":
          description: Attendance in the selected IST month
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceHistory" }
  /attendance/scan:
    post:
      operationId: scanAttendance
      tags: [attendance]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttendanceScanInput" }
      responses:
        "200":
          description: Idempotent QR attendance result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceScanResult" }
  /partner/gyms/{gymId}/attendance-qr:
    get:
      operationId: getPartnerAttendanceQr
      tags: [partner]
      parameters:
        - in: path
          name: gymId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Printable branch QR payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerAttendanceQr" }
  /admin/partners/{partnerId}/gyms/{gymId}/attendance-qr:
    get:
      operationId: getAdminPartnerAttendanceQr
      tags: [partner]
      security: [{adminSession: []}]
      parameters:
        - {in: path, name: partnerId, required: true, schema: {type: integer, minimum: 1}}
        - {in: path, name: gymId, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Printable member check-in/check-out QR for an owned, verified branch
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PartnerAttendanceQr"}
        "401": {description: Admin authentication required}
        "403": {description: Branch verification or attendance mapping missing}
        "404": {description: Branch is not assigned to the selected partner}
  /ai/chat:
    post:
      operationId: aiChat
      tags: [ai]
      summary: Chat with the Iconic Fitness AI assistant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiChatInput" }
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiChatOutput" }
        "503":
          description: AI assistant not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiChatOutput" }
  /ai/coach:
    post:
      operationId: aiCoach
      tags: [ai]
      summary: Personalized AI fitness coach (uses the member's own tracking data)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiChatInput" }
      responses:
        "200":
          description: Coach reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiChatOutput" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiChatOutput" }
        "503":
          description: AI coach not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiChatOutput" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /me:
    get:
      operationId: getMe
      tags: [profile]
      summary: Get the current user profile + fitness stats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
    patch:
      operationId: updateMe
      tags: [profile]
      summary: Update the current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserProfileUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }

  /fitness-setup:
    get:
      operationId: getFitnessSetup
      tags: [fitness-setup]
      summary: Get the caller's private first-login fitness setup progress
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessSetup" }
    patch:
      operationId: saveFitnessSetupStep
      tags: [fitness-setup]
      summary: Save one private fitness setup step for the caller
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FitnessSetupStepSave" }
      responses:
        "200":
          description: Saved setup progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessSetup" }
  /fitness-setup/complete:
    post:
      operationId: completeFitnessSetup
      tags: [fitness-setup]
      summary: Complete the caller's first-login fitness setup
      responses:
        "200":
          description: Completed setup
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessSetup" }

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Personalized home dashboard summary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }

  /home-slides:
    get:
      operationId: listHomeSlides
      tags: [gyms]
      summary: Active Home hero and banner slides (public)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HomeSlide" }
  /store/categories:
    get:
      operationId: listStoreCategories
      tags: [gyms]
      summary: Active storefront product categories (public)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StoreCategory" }
  /store/products:
    get:
      operationId: listStoreProducts
      tags: [gyms]
      summary: Active storefront products (public)
      parameters:
        - in: query
          name: category
          required: false
          schema: { type: string }
        - in: query
          name: q
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StoreProduct" }
  /store/checkout:
    post:
      operationId: storeCheckout
      tags: [gyms]
      summary: Start a store order with online payment (guest or signed-in)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreCheckoutRequest" }
      responses:
        "200":
          description: Order placed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreCheckoutResponse" }
        "400":
          description: Invalid input
  /store/orders/mine:
    get:
      operationId: listMyStoreOrders
      tags: [gyms]
      summary: Store orders of the signed-in member, newest first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StoreOrder" }
        "401":
          description: Not signed in
  /gyms:
    get:
      operationId: listGyms
      tags: [gyms]
      summary: Search and filter gyms
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string, description: "e.g. gym, yoga, crossfit, pilates, mma, swimming, zumba" }
        - in: query
          name: amenity
          schema: { type: string }
        - in: query
          name: lat
          schema: { type: number, description: "User latitude; when provided with lng, distanceKm is computed from the user's location." }
        - in: query
          name: lng
          schema: { type: number, description: "User longitude; when provided with lat, distanceKm is computed from the user's location." }
        - in: query
          name: sort
          schema: { type: string, enum: [distance, rating, price] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Gym" }
  /gyms/featured:
    get:
      operationId: listFeaturedGyms
      tags: [gyms]
      summary: Curated featured gyms for the homepage
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Gym" }
  /gyms/categories:
    get:
      operationId: listGymCategories
      tags: [gyms]
      summary: Categories with counts (for filter chips)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CategoryCount" }
  /gyms/{gymId}:
    get:
      operationId: getGym
      tags: [gyms]
      summary: Get a single gym with full details
      parameters:
        - in: path
          name: gymId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GymDetail" }
  /gyms/{gymId}/classes:
    get:
      operationId: listGymClasses
      tags: [classes]
      summary: List upcoming class sessions at a gym
      parameters:
        - in: path
          name: gymId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClassSession" }

  /classes:
    get:
      operationId: listClasses
      tags: [classes]
      summary: Browse upcoming class sessions across all gyms
      parameters:
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: date
          schema: { type: string, description: "ISO date (YYYY-MM-DD)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClassSession" }
  /classes/trending:
    get:
      operationId: listTrendingClasses
      tags: [classes]
      summary: Trending classes (booked the most this week)
      responses:
        "200":
