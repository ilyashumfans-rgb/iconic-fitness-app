openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: GYMCO customer API — multi-gym memberships, classes, bookings, check-ins, and fitness tracking.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: profile
  - name: gyms
  - name: classes
  - name: bookings
  - name: memberships
  - name: trainers
  - name: wallet
  - name: dashboard
  - name: tracking
    description: Daily wellness tracking — water, meals/calories, workouts, steps, goals, progress
  - name: checkins
    description: Member gym check-ins
  - name: ai
    description: Iconic Fitness AI assistant
paths:
  /ai/chat:
    post:
      operationId: aiChat
      tags: [ai]
      summary: Chat with the Iconic Fitness AI assistant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiChatInput" }
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiChatOutput" }
        "503":
          description: AI assistant not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiChatOutput" }
  /ai/coach:
    post:
      operationId: aiCoach
      tags: [ai]
      summary: Personalized AI fitness coach (uses the member's own tracking data)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiChatInput" }
      responses:
        "200":
          description: Coach reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiChatOutput" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiChatOutput" }
        "503":
          description: AI coach not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiChatOutput" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /me:
    get:
      operationId: getMe
      tags: [profile]
      summary: Get the current user profile + fitness stats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
    patch:
      operationId: updateMe
      tags: [profile]
      summary: Update the current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserProfileUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Personalized home dashboard summary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }

  /home-slides:
    get:
      operationId: listHomeSlides
      tags: [gyms]
      summary: Active home banner slides (public)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HomeSlide" }
  /store/categories:
    get:
      operationId: listStoreCategories
      tags: [gyms]
      summary: Active storefront product categories (public)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StoreCategory" }
  /store/products:
    get:
      operationId: listStoreProducts
      tags: [gyms]
      summary: Active storefront products (public)
      parameters:
        - in: query
          name: category
          required: false
          schema: { type: string }
        - in: query
          name: q
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StoreProduct" }
  /gyms:
    get:
      operationId: listGyms
      tags: [gyms]
      summary: Search and filter gyms
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string, description: "e.g. gym, yoga, crossfit, pilates, mma, swimming, zumba" }
        - in: query
          name: amenity
          schema: { type: string }
        - in: query
          name: lat
          schema: { type: number, description: "User latitude; when provided with lng, distanceKm is computed from the user's location." }
        - in: query
          name: lng
          schema: { type: number, description: "User longitude; when provided with lat, distanceKm is computed from the user's location." }
        - in: query
          name: sort
          schema: { type: string, enum: [distance, rating, price] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Gym" }
  /gyms/featured:
    get:
      operationId: listFeaturedGyms
      tags: [gyms]
      summary: Curated featured gyms for the homepage
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Gym" }
  /gyms/categories:
    get:
      operationId: listGymCategories
      tags: [gyms]
      summary: Categories with counts (for filter chips)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CategoryCount" }
  /gyms/{gymId}:
    get:
      operationId: getGym
      tags: [gyms]
      summary: Get a single gym with full details
      parameters:
        - in: path
          name: gymId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GymDetail" }
  /gyms/{gymId}/classes:
    get:
      operationId: listGymClasses
      tags: [classes]
      summary: List upcoming class sessions at a gym
      parameters:
        - in: path
          name: gymId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClassSession" }

  /classes:
    get:
      operationId: listClasses
      tags: [classes]
      summary: Browse upcoming class sessions across all gyms
      parameters:
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: date
          schema: { type: string, description: "ISO date (YYYY-MM-DD)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClassSession" }
  /classes/trending:
    get:
      operationId: listTrendingClasses
      tags: [classes]
      summary: Trending classes (booked the most this week)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClassSession" }
  /classes/{classId}:
    get:
      operationId: getClass
      tags: [classes]
      summary: Get a single class session
      parameters:
        - in: path
          name: classId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassSessionDetail" }

  /memberships:
    get:
      operationId: listMemberships
      tags: [memberships]
      summary: List available membership plans
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MembershipPlan" }
  /memberships/mine:
    get:
      operationId: getMyMembership
      tags: [memberships]
      summary: Get the user's current active membership (null if none)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MyMembership"
                  - type: "null"
  /memberships/mine/payments:
    get:
      operationId: listMyMembershipPayments
      tags: [memberships]
      summary: List the user's plan purchase/renewal history (from YoActiv; empty if not linked)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MembershipPayment" }

  /notifications/mine:
    get:
      operationId: listMyNotifications
      tags: [notifications]
      summary: List the member's notifications (newest first)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
  /notifications/mine/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark one notification as read
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }
  /notifications/mine/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all of the member's notifications as read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }

  /bookings:
    get:
      operationId: listMyBookings
      tags: [bookings]
      summary: List the user's bookings
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [upcoming, past, cancelled] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Booking" }
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Book a class session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
  /bookings/{bookingId}:
    delete:
      operationId: cancelBooking
      tags: [bookings]
      summary: Cancel a booking
      parameters:
        - in: path
          name: bookingId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }


  /trainers/live:
    get:
      operationId: listLiveTrainers
      tags: [trainers]
      summary: Live personal-trainer roster from the gym-management system (empty if unavailable)
      parameters:
        - in: query
          name: gymId
          schema: { type: integer }
          description: Scope the roster to a branch (gym) when it is mapped to a YoActiv branch
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LiveTrainer" }

  /trainer-packages:
    get:
      operationId: listTrainerPackages
      tags: [trainers]
      summary: Purchasable session packages for a branch (live prices from the gym-management system)
      parameters:
        - in: query
          name: gymId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TrainerPackage" }

  /trainer-bookings:
    post:
      operationId: createTrainerBooking
      tags: [trainers]
      summary: Start a paid trainer-session booking; returns the hosted payment link
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTrainerBookingRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainerBookingCreated" }
  /trainer-bookings/{bookingId}:
    get:
      operationId: getTrainerBooking
      tags: [trainers]
      summary: Status of one of the caller's trainer bookings
      parameters:
        - in: path
          name: bookingId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainerBooking" }

  /trainers:
    get:
      operationId: listTrainers
      tags: [trainers]
      summary: Browse trainers in the marketplace
      parameters:
        - in: query
          name: specialty
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Trainer" }
  /trainers/{trainerId}:
    get:
      operationId: getTrainer
      tags: [trainers]
      summary: Trainer profile
      parameters:
        - in: path
          name: trainerId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trainer" }

  /challenges:
    get:
      operationId: listChallenges
      tags: [challenges]
      summary: List challenges with the current user's progress
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Challenge" }
  /challenges/{challengeId}:
    get:
      operationId: getChallenge
      tags: [challenges]
      summary: Challenge detail with leaderboard
      parameters:
        - in: path
          name: challengeId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChallengeDetail" }
  /challenges/{challengeId}/join:
    post:
      operationId: joinChallenge
      tags: [challenges]
      summary: Join a challenge
      parameters:
        - in: path
          name: challengeId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChallengeDetail" }
  /challenges/{challengeId}/leave:
    post:
      operationId: leaveChallenge
      tags: [challenges]
      summary: Leave a challenge
      parameters:
        - in: path
          name: challengeId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChallengeDetail" }

  /wallet:
    get:
      operationId: getWallet
      tags: [wallet]
      summary: Wallet balance and recent transactions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }

  /tracking/summary:
    get:
      operationId: getTrackingSummary
      tags: [tracking]
      summary: Today's wellness summary (water, calories, steps, workouts, streak)
      parameters:
        - in: query
          name: date
          schema: { type: string, description: "YYYY-MM-DD (IST); defaults to today" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailySummary" }

  /tracking/water:
    get:
      operationId: getWaterDay
      tags: [tracking]
      summary: Water intake entries for a day
      parameters:
        - in: query
          name: date
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaterDay" }
    post:
      operationId: addWater
      tags: [tracking]
      summary: Log water intake
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaterInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaterDay" }
  /tracking/water/{id}:
    delete:
      operationId: deleteWater
      tags: [tracking]
      summary: Remove a water entry
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }

  /tracking/meals:
    get:
      operationId: getMealDay
      tags: [tracking]
      summary: Meals logged for a day with calorie/macro totals
      parameters:
        - in: query
          name: date
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MealDay" }
    post:
      operationId: addMeal
      tags: [tracking]
      summary: Log a meal / food item
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MealInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MealDay" }
  /tracking/meals/{id}:
    delete:
      operationId: deleteMeal
      tags: [tracking]
      summary: Remove a meal entry
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }

  /tracking/workouts:
    get:
      operationId: getWorkoutDay
      tags: [tracking]
      summary: Workouts logged for a day with totals
      parameters:
        - in: query
          name: date
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutDay" }
    post:
      operationId: addWorkout
      tags: [tracking]
      summary: Log a workout / activity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkoutInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutDay" }
  /tracking/workouts/{id}:
    delete:
      operationId: deleteWorkout
      tags: [tracking]
      summary: Remove a workout entry
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }

  /tracking/progress:
    get:
      operationId: getProgress
      tags: [tracking]
      summary: Multi-day progress series for charts
      parameters:
        - in: query
          name: days
          schema: { type: integer, default: 7, description: "Number of trailing days (1-31)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressReport" }

  /tracking/goals:
    get:
      operationId: getGoals
      tags: [tracking]
      summary: Get the user's daily goals
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goals" }
    patch:
      operationId: updateGoals
      tags: [tracking]
      summary: Update daily goals
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalsUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goals" }

  /checkins:
    get:
      operationId: listMyCheckins
      tags: [checkins]
      summary: The user's recent gym check-ins
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Checkin" }
    post:
      operationId: createCheckin
      tags: [checkins]
      summary: Check in to a gym (once per gym per day)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckinInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checkin" }

components:
  schemas:
    AiChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: ["user", "assistant"] }
        content: { type: string }
    AiChatInput:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/AiChatMessage" }
    AiChatOutput:
      type: object
      required: [reply]
      properties:
        reply: { type: string }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    UserProfile:
      type: object
      required:
        [
          id, name, email, mobile, gender, age, heightCm, weightKg,
          fitnessGoal, avatarUrl, city, bmi, fitnessScore,
          dailyCalories, dailyWaterMl, dailySleepHours, restingHr,
          streakDays, weeklyWorkouts, weeklyGoal, joinedAt,
          assessmentComplete, bmr, tdee, bodyFatPct
        ]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        mobile: { type: string }
        gender: { type: string }
        age: { type: integer }
        heightCm: { type: number }
        weightKg: { type: number }
        fitnessGoal: { type: string }
        avatarUrl: { type: string }
        city: { type: string }
        bmi: { type: number }
        fitnessScore: { type: integer, description: "0-100 composite AI score" }
        dailyCalories: { type: integer }
        dailyWaterMl: { type: integer }
        dailySleepHours: { type: number }
        restingHr: { type: integer }
        streakDays: { type: integer }
        weeklyWorkouts: { type: integer }
        weeklyGoal: { type: integer }
        joinedAt: { type: string, format: date-time }
        assessmentComplete:
          { type: boolean, description: "True once the AI fitness assessment is done" }
        experienceLevel:
          { type: string, nullable: true, description: "new | experienced" }
        targetWeightKg: { type: number, nullable: true }
        bmr: { type: number, description: "Basal metabolic rate (kcal); 0 if unknown" }
        tdee: { type: number, description: "Maintenance calories (kcal); 0 if unknown" }
        bodyFatPct: { type: number, description: "Estimated body fat %; 0 if unknown" }
    UserProfileUpdate:
      type: object
      properties:
        name: { type: string }
        mobile: { type: string }
        gender: { type: string }
        age: { type: integer }
        heightCm: { type: number }
        weightKg: { type: number }
        fitnessGoal: { type: string }
        avatarUrl: { type: string }
        city: { type: string }
        weeklyGoal: { type: integer }

    HomeSlide:
      type: object
      required: [id, kind, mediaUrl, title, subtitle, ctaLabel, ctaUrl, audience]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [image, gif, youtube] }
        mediaUrl:
          { type: string, description: "db-image URL / GIF URL, or a YouTube URL when kind=youtube" }
        title: { type: string }
        subtitle: { type: string }
        ctaLabel: { type: string }
        ctaUrl: { type: string }
        audience:
          type: string
          enum: [all, members, customers]
          description: "Who sees this slide: all viewers, members (active plan) only, or customers (non-members) only"
    StoreCategory:
      type: object
      required: [name, slug, sortOrder]
      properties:
