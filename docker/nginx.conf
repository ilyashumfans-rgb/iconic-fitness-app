server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reasonable upload size for image uploads (stored in DB).
    client_max_body_size 25m;

    # Proxy API calls to the api-server container.
    # IMPORTANT: do NOT rewrite the path — Express mounts routes under /api
    # (app.use("/api", router)), and the Clerk proxy lives at /api/__clerk.
    location /api/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — all non-asset routes serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
