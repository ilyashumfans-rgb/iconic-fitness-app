kind = "web"
previewPath = "/"
title = "GYMCO"
version = "1.0.0"
id = "artifacts/gymco"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19760

[services.development]
run = "pnpm --filter @workspace/gymco run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gymco", "run", "build" ]
publicDir = "artifacts/gymco/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19760"
BASE_PATH = "/"
